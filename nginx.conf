# Nginx config optimized for serving a Vite-built SPA
server {
  listen       80;
  server_name  _;

  # Serve static files from the dist directory
  root   /usr/share/nginx/html;
  index  index.html;

  # Gzip for common text assets
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Try file, then fallback to index.html for client-side routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache static assets aggressively (fingerprinted by Vite)
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp)$ {
    expires 1y;
    access_log off;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
